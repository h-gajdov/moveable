# Accessible Skopje — local / self-hosted stack.
#   docker compose up -d --build            # database, backend, frontend
#   docker compose run --rm pipeline all    # download + import Skopje OSM data
name: accessible-skopje

services:
  db:
    image: pgrouting/pgrouting:17-3.5-3.8.0
    environment:
      POSTGRES_DB: ${DB_NAME:-accessible_skopje}
      POSTGRES_USER: ${DB_USER:-accessible}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-accessible_skopje}
      DB_USER: ${DB_USER:-accessible}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      UPLOAD_DIR: /var/lib/accessible-skopje/uploads
    volumes:
      - uploads:/var/lib/accessible-skopje/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      MAP_ORIGINS: ${MAP_ORIGINS:-https://tiles.openfreemap.org}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

  pipeline:
    build: ./data-pipeline
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-accessible_skopje}
      DB_USER: ${DB_USER:-accessible}
      DB_PASSWORD: ${DB_PASSWORD}
      DATA_DIR: /data
    volumes:
      - ./data-pipeline/data:/data

volumes:
  db-data:
  uploads:
